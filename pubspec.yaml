name: iron_street_app
description: "Iron Street - Premium Solid Wood Furniture & Decor Mobile Application using GetX MVC."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_launcher_icons: ^0.13.1
  intl: ^0.19.0
  dio: ^5.9.2
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.0
  flutter_svg: ^2.3.0
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
